<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze Runner | Jev 検証</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Maze Runner <span>Jev (System One モデル) に裁定させて自動クリアを目指す検証アプリ</span></h1>
    <div id="apiBadge" class="badge">接続確認中…</div>
  </header>

  <main>
    <section class="stage">
      <canvas id="board" width="456" height="504"></canvas>
      <div class="hud">
        <div><label>SCORE</label><b id="hudScore">0</b></div>
        <div><label>LIVES</label><b id="hudLives">3</b></div>
        <div><label>残りペレット</label><b id="hudPellets">0</b></div>
        <div><label>TICK</label><b id="hudTick">0</b></div>
        <div><label>状態</label><b id="hudStatus">待機中</b></div>
      </div>
      <div class="buttons">
        <button id="btnStart" class="primary">▶ スタート</button>
        <button id="btnPause" disabled>⏸ 一時停止</button>
        <button id="btnReset">↺ リセット</button>
      </div>
      <p id="errorBox" class="error" hidden></p>
    </section>

    <section class="panel">
      <h2>実行設定</h2>
      <div class="grid">
        <label>戦略
          <select id="strategy"></select>
        </label>
        <label>進行モード
          <select id="timing">
            <option value="sync">同期: Jev の回答を待って 1 手進む</option>
            <option value="realtime">リアルタイム: 固定 tick、回答が遅れたら直進</option>
          </select>
        </label>
        <label>tick 間隔 <output id="tickMsOut"></output>
          <input id="tickMs" type="range" min="60" max="500" step="10" value="160">
        </label>
        <label>ゴースト数
          <select id="ghosts"><option>1</option><option>2</option><option>3</option><option selected>4</option></select>
        </label>
        <label>シード
          <input id="seed" type="number" min="1" value="1">
        </label>
        <label>連続エピソード数
          <input id="episodes" type="number" min="1" max="50" value="1">
        </label>
        <label class="wide">入力単価 ($ / 100 万トークン) <small>空欄ならコストは計算しない。値はこのブラウザにだけ保存される</small>
          <input id="price" type="number" min="0" step="0.001" placeholder="契約している単価を入力">
        </label>
        <label class="wide check">
          <input id="gateOn" type="checkbox">
          confidence がしきい値未満ならヒューリスティックへフォールバック
          <output id="gateOut"></output>
          <input id="gate" type="range" min="0" max="1" step="0.05" value="0.5">
        </label>
      </div>

      <h2>計測 <small>（現在のエピソード）</small></h2>
      <dl id="metrics" class="metrics"></dl>

      <h2>直近の裁定</h2>
      <div id="decision" class="decision"><p class="muted">まだ裁定がありません。</p></div>
      <details>
        <summary>Jev に送った state / questions</summary>
        <pre id="requestDump"></pre>
      </details>

      <h2>エピソード結果 <button id="btnCsv" class="small">CSV コピー</button></h2>
      <div class="tableWrap">
        <table id="results">
          <thead><tr><th>#</th><th>戦略</th><th>進行</th><th>G</th><th>seed</th><th>結果</th><th>score</th><th>クリア率</th><th>tick</th><th>裁定数</th><th>平均ms</th><th>p95ms</th><th>tokens</th><th>$</th><th>FB</th><th>stale</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
